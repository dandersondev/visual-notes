name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      # Tests must gate the release itself. CI runs them on push to main, but
      # a commit and its tag are pushed together, so the two workflows race —
      # without this step a release could publish from a commit whose tests
      # fail.
      - name: Run tests
        run: npm test

      # NOTE: no attestation step, deliberately. Attestations generated here
      # (attest-build-provenance v1/v2, actions/attest v4 — all tried) are
      # cryptographically well-formed and correctly identify this repo, but
      # Obsidian's release checker fails to verify them ("signature is
      # invalid or does not match this repository"), turning an optional
      # nice-to-have into a hard review Error. A missing attestation is only
      # a soft Recommendation. Attestations are also permanent and keyed by
      # file digest — re-attesting unchanged bytes stacks more of them — so
      # don't re-add this step unless Obsidian's verifier is confirmed fixed.
      #
      # This was re-added once during the 1.3.x review cycle and reverted
      # again: three releases (1.0.13, 1.0.16, 1.0.17) had already failed
      # review on exactly this, including with actions/attest@v4. See
      # commit 45c51c8. A present-but-unverifiable attestation is strictly
      # worse than none.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
